server.port=${PORT:15070}
logging.level.org.atmosphere = warn
spring.jpa.open-in-view=false

# Launch the default browser when starting the application in development mode
#vaadin.launch-browser=true
# PostgreSQL configuration.
spring.datasource.url = ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/forwarderdb}
spring.datasource.username = ${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password = ${SPRING_DATASOURCE_PASSWORD:asdf1234}
spring.jpa.hibernate.ddl-auto = ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
#spring.jpa.show-sql=true
# To improve the performance during development.
# For more information https://vaadin.com/docs/latest/integrations/spring/configuration#special-configuration-parameters
vaadin.allowed-packages = com.vaadin,org.vaadin,com.lazoft.forwarderplus
spring.jpa.defer-datasource-initialization = true
spring.sql.init.mode = always

exchange.api.url=${EXCHANGE_API_URL:https://v6.exchangerate-api.com/}
exchange.api.version=${EXCHANGE_API_VERSION:v6}
exchange.api.key=${EXCHANGE_API_KEY:cc441057fb5892890b1abda6}
exchange.api.pair.conversion.endpoint=${EXCHANGE_API_ENDPOINT:/pair}

income.ledger.code=${INCOME_LEDGER_CODE:1}
expense.ledger.code=${EXPENSE_LEDGER_CODE:2}

dev.env=true